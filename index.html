<!DOCTYPE Html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For you</title>
</head>
<style>
  body{
      background-color: pink;
      display:flex;
      justify-content:center;
      text-align: center;
      align-items: center;
      height: 100vh;
      margin: 0;
}
  .color{
      font-family: 'optima', fantasy;
      font-size: 30px;
      letter-spacing: 5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff005, #ffcc00, #00ffcc, #ff0055);
      background-size: 300%;
      filter: drop-shadow(0px 0px 15px rgba(255, 0, 85, 0.8));
      animation: colorshift 4s linear infinite, animeFloat 1.5s ease-in-out infinite alternate;
      
}

 @keyframe colorShift{
     0% { background-position: 0% 50%; }
     100% { background-position: 300% 50%; }
}

 @keyframe animefloat {
     0% { transform: scale(1) rotate(-2deg); }
     100% { transform: scale(1.1) rotate(2deg); }
}
  mainpage{
      display:flex;
}
 button{
     background-color: red;
     color: white;
      margin:20px auto;
      font-family: 'Bangers', cursive;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff003, #ffcc04, #00ffcc, #ff0055);
      animation: colorshift 4s linear infinite, animeFloat 1.5s ease-in-out infinite alternate;
     
}
 button.hover{
     0% { background-position: 0% 50%; }
     100% { background-position: 300% 50%; }
     }
.flower {
    position: fixed;
    top: -50px;
    font-size: 28px;
    pointer-events: none;
    z-index: 999;
    animation: fall linear forwards;
}
.propose-flower {
  position: fixed;
  font-size: 30px;
  pointer-events: none;
  z-index: 1000;
  transition: transform 1.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.5s ease;
}
.proposal-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(255, 255, 255, 0.96);
      padding: 28px 24px;
      border-radius: 26px;
      box-shadow: 0 15px 40px rgba(255, 0, 85, 0.35);
      text-align: center;
      z-index: 1001;
      width: 82%;
      max-width: 330px;
      opacity: 0;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
    }

    .proposal-box.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .proposal-box h2 {
      color: #ff0055;
      margin: 10px 0;
      font-size: 24px;
    }

    .proposal-box p {
      color: #333;
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 0;
}

@keyframes fall {
   0% {
         transform: translateY(0) rotate(0deg);
         opacity: 1;
}
   100% {
         transform: translateY(105vh) rotate(360deg);
         opacity: 0;
}}
</style>
<body>
  <div container="mainpage">
       <p class="color" id="inner-text">Unga kitta onnu solliye aganum</p>
       <button style= "display:block" ; onclick="complement()">Click me</button>
<audio id="bg-music" src="Song.mp3" loop></audio>
 </div>

<script>
   const compliment = [
      "neenga romba alagha irukinga"
];
let proposalTriggered = false;

   function complement() {
     const music = document.getElementById("bg-music"); document.getElementById("inner-text").innerText = compliment;
if (music) {
        music.play();
      }

      // 2. Drop initial flowers
      dropFlowers();

      // 3. Smoothly fade and swap compliment text
      textElement.classList.add("fade-out");
      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * compliment.length);
        textElement.innerText = compliment[randomIndex];
        textElement.classList.remove("fade-out");
      }, 400);

      // 4. After 3 seconds, bring all flowers together into a heart
      if (!proposalTriggered) {
        proposalTriggered = true;
        setTimeout(() => {
          triggerFlowerHeart();
        }, 3000);
      }
    }
  function dropFlowers() {
      const flowers = ["🌹","❤️","🌸"];
      for( let i=0; i<20; i++){
      const flower = document.createElement("div");
      flower.classList.add("flower");
      flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
      flower.style.left = Math.random() * 100 + "vw";
      flower.style.animationDuration = (Math.random() * 2 + 2) + "s";
      document.body.appendChild(flower);
      setTimeout(()=> {
         flower.remove();
      }, 4000);
    }
   }

function triggerFlowerHeart() {
      const bouquet = ["🌹", "🌸", "💐", "🌺", "🌷", "❤️"];
      const totalFlowers = 36;
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      for (let i = 0; i < totalFlowers; i++) {
        const f = document.createElement("div");
        f.classList.add("propose-flower");
        f.innerText = bouquet[i % bouquet.length];

        const t = (i / totalFlowers) * Math.PI * 2;
        const heartX = 16 * Math.pow(Math.sin(t), 3);
        const heartY = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

        const startRadius = Math.max(window.innerWidth, window.innerHeight);
        const startX = centerX + Math.cos(t) * startRadius;
        const startY = centerY + Math.sin(t) * startRadius;

        const scale = 9;
        const endX = centerX + heartX * scale - 15;
        const endY = centerY + heartY * scale - 15;

        f.style.left = "0px";
        f.style.top = "0px";
        f.style.transform = `translate(${startX}px, ${startY}px) scale(0.5)`;
        document.body.appendChild(f);

setTimeout(() => {
          f.style.transform = `translate(${endX}px, ${endY}px) scale(1.2) rotate(360deg)`;
        }, 50);
      }
        setTimeout(() => {
          f.style.transform = `translate(${endX}px, ${endY}px) scale(1.1) rotate(360deg)`;
        }, 50);
      }
</script>
</body>

</html>
