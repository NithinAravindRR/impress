<!DOCTYPE Html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For you</title>
</head>
<style>
  body{
      background-color: pink;
      display:flex;
      justify-content:center;
      text-align: center;
      align-items: center;
      height: 100vh;
      margin: 0;
}
  .color{
      font-family: 'optima', fantasy;
      font-size: 30px;
      letter-spacing: 5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff005, #ffcc00, #00ffcc, #ff0055);
      background-size: 300%;
      filter: drop-shadow(0px 0px 15px rgba(255, 0, 85, 0.8));
      animation: colorshift 4s linear infinite, animeFloat 1.5s ease-in-out infinite alternate;
      
}

 @keyframe colorShift{
     0% { background-position: 0% 50%; }
     100% { background-position: 300% 50%; }
}

 @keyframe animefloat {
     0% { transform: scale(1) rotate(-2deg); }
     100% { transform: scale(1.1) rotate(2deg); }
}
  mainpage{
      display:flex;
}
 button{
     background-color: red;
     color: white;
      margin:20px auto;
      font-family: 'Bangers', cursive;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff003, #ffcc04, #00ffcc, #ff0055);
      animation: colorshift 4s linear infinite, animeFloat 1.5s ease-in-out infinite alternate;
     
}
 button.hover{
     0% { background-position: 0% 50%; }
     100% { background-position: 300% 50%; }
     }
.flower {
    position: fixed;
    top: -50px;
    font-size: 28px;
    pointer-events: none;
    z-index: 999;
    animation: fall linear forwards;
}
.propose-flower {
  position: fixed;
  left: 0;
  top: 0;
  font-size: 32px;
  pointer-events: none;
  z-index: 1000;
}


@keyframes fall {
   0% {
         transform: translateY(0) rotate(0deg);
         opacity: 1;
}
   100% {
         transform: translateY(105vh) rotate(360deg);
         opacity: 0;
}}
</style>
<body>
  <div container="mainpage">
       <p class="color" id="inner-text">Unga kitta onnu solliye aganum ☺️</p>
       <button style= "display:block" ; onclick="complement()">Click me</button>
<audio id="bg-music" src="Song.mp3" loop></audio>
 </div>

<script>
   const compliment = [
      "neenga romba alagha irukinga 🥰"
];
let proposalTriggered = false;

    function complement() {
      const textElement = document.getElementById("inner-text");
      const music = document.getElementById("bg-music");

      // 1. Play background song
      if (music) {
        music.play().catch(() => {});
      }

      // 2. Drop initial flowers
      dropFlowers();

      // 3. Smoothly fade and swap compliment text
      textElement.classList.add("fade-out");
      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * compliment.length);
        textElement.innerText = compliment[randomIndex];
        textElement.classList.remove("fade-out");
      }, 150);

      // 4. After 3 seconds, bring all flowers inward!
      if (!proposalTriggered) {
        proposalTriggered = true;
        setTimeout(() => {
          triggerProposalAnimation();
        }, 3000);
      }
    }

    function dropFlowers() {
      const flowers = ["🌹", "❤️", "🌸"];
      for (let i = 0; i < 20; i++) {
        const flower = document.createElement("div");
        flower.classList.add("flower");
        flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
        flower.style.left = Math.random() * 100 + "vw";
        flower.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(flower);

        setTimeout(() => {
          flower.remove();
        }, 4000);
      }
    }

    function triggerProposalAnimation() {
  const bouquet = ["🌹", "🌸", "❤️","✨"];
  const totalFlowers = 32;

  // Target the exact center of your compliment text
  const textBox = document.getElementById("inner-text").getBoundingClientRect();
  const centerX = textBox.left + textBox.width / 2;
  const centerY = textBox.top + textBox.height / 2;

  // Scale the heart so it fits cleanly around your text on any screen
  const scale = Math.min(window.innerWidth, window.innerHeight) * 0.022;

  for (let i = 0; i < totalFlowers; i++) {
    const f = document.createElement("div");
    f.classList.add("propose-flower");
    f.innerText = bouquet[i % bouquet.length];
    f.style.marginLeft = "-16px";
    f.style.marginTop = "-16px";

    // Heart shape mathematical formula
    const t = (i / totalFlowers) * Math.PI * 2;
    const heartX = 16 * Math.pow(Math.sin(t), 3);
    const heartY = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

    // Starting & ending off-screen positions
    const outerRadius = Math.max(window.innerWidth, window.innerHeight) * 0.85;
    const outerX = centerX + Math.cos(t) * outerRadius;
    const outerY = centerY + Math.sin(t) * outerRadius;

    // Heart formation position around the center
    const endX = centerX + heartX * scale;
    const endY = centerY + heartY * scale;

    document.body.appendChild(f);

    // Phase 1: Fly in to form the heart (1.2 seconds)
    const flyIn = f.animate(
      [
        { transform: `translate(${outerX}px, ${outerY}px) scale(0.4) rotate(0deg)`, opacity: 0 },
        { transform: `translate(${endX}px, ${endY}px) scale(1.15) rotate(360deg)`, opacity: 1 }
      ],
      {
        duration: 1200,
        easing: "cubic-bezier(0.22, 1, 0.36, 1)",
        fill: "forwards"
      }
    );

    // Phase 2: After 2 seconds (2000ms), fly away just as they came!
    setTimeout(() => {
      const flyOut = f.animate(
        [
          { transform: `translate(${endX}px, ${endY}px) scale(1.15) rotate(360deg)`, opacity: 1 },
          { transform: `translate(${outerX}px, ${outerY}px) scale(0.4) rotate(720deg)`, opacity: 0 }
        ],
        {
          duration: 1200,
          easing: "cubic-bezier(0.55, 0, 1, 0.45)",
          fill: "forwards"
        }
      );

      // Clean up from memory once off-screen
      flyOut.onfinish = () => f.remove();
    }, 2000);
  }
}

</script>
</body>
</html>
