<!DOCTYPE Html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For you</title>
</head>
<style>
  body{
      background-color: pink;
      display:flex;
      justify-content:center;
      text-align: center;
      align-items: center;
      height: 100vh;
      margin: 0;
}
  .color{
      font-family: 'optima', fantasy;
      font-size: 30px;
      letter-spacing: 5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff005, #ffcc00, #00ffcc, #ff0055);
      background-size: 300%;
      filter: drop-shadow(0px 0px 15px rgba(255, 0, 85, 0.8));
      animation: colorshift 4s linear infinite, animeFloat 1.5s ease-in-out infinite alternate;
      
}

 @keyframe colorShift{
     0% { background-position: 0% 50%; }
     100% { background-position: 300% 50%; }
}

 @keyframe animefloat {
     0% { transform: scale(1) rotate(-2deg); }
     100% { transform: scale(1.1) rotate(2deg); }
}
  mainpage{
      display:flex;
}
 button{
     background-color: red;
     color: white;
      margin:20px auto;
      font-family: 'Bangers', cursive;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff003, #ffcc04, #00ffcc, #ff0055);
      animation: colorshift 4s linear infinite, animeFloat 1.5s ease-in-out infinite alternate;
     
}
 button.hover{
     0% { background-position: 0% 50%; }
     100% { background-position: 300% 50%; }
     }
.flower {
    position: fixed;
    top: -50px;
    font-size: 28px;
    pointer-events: none;
    z-index: 999;
    animation: fall linear forwards;
}
.propose-flower {
  position: fixed;
  font-size: 30px;
  pointer-events: none;
  z-index: 1000;
  transition: transform 1.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.5s ease;
}

@keyframes fall {
   0% {
         transform: translateY(0) rotate(0deg);
         opacity: 1;
}
   100% {
         transform: translateY(105vh) rotate(360deg);
         opacity: 0;
}}
</style>
<body>
  <div container="mainpage">
       <p class="color" id="inner-text">Unga kitta onnu solliye aganum</p>
       <button style= "display:block" ; onclick="complement()">Click me</button>
<audio id="bg-music" src="Song.mp3" loop></audio>
 </div>

<script>
   const compliment = [
      "neenga romba alagha irukinga"
];
let proposalTriggered = false;

    function complement() {
      const textElement = document.getElementById("inner-text");
      const music = document.getElementById("bg-music");

      // 1. Play background song
      if (music) {
        music.play().catch(() => {});
      }

      // 2. Drop initial flowers
      dropFlowers();

      // 3. Smoothly fade and swap compliment text
      textElement.classList.add("fade-out");
      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * compliment.length);
        textElement.innerText = compliment[randomIndex];
        textElement.classList.remove("fade-out");
      }, 400);

      // 4. After 3 seconds, bring all flowers inward!
      if (!proposalTriggered) {
        proposalTriggered = true;
        setTimeout(() => {
          triggerProposalAnimation();
        }, 3000);
      }
    }

    function dropFlowers() {
      const flowers = ["🌸", "🤍", "🌹", "🌷"];
      for (let i = 0; i < 20; i++) {
        const flower = document.createElement("div");
        flower.classList.add("flower");
        flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
        flower.style.left = Math.random() * 100 + "vw";
        flower.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(flower);

        setTimeout(() => {
          flower.remove();
        }, 4000);
      }
    }

    function triggerProposalAnimation() {
      const bouquet = ["🌹", "🌸", "💐", "💍", "🌷", "❤️"];
      const totalFlowers = 28;
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const endRadius = Math.min(window.innerWidth, window.innerHeight) * 0.38;

      for (let i = 0; i < totalFlowers; i++) {
        const f = document.createElement("div");
        f.classList.add("propose-flower");
        f.innerText = bouquet[i % bouquet.length];

        const angle = (i / totalFlowers) * Math.PI * 2;
        const startRadius = Math.max(window.innerWidth, window.innerHeight);
        const startX = centerX + Math.cos(angle) * startRadius;
        const startY = centerY + Math.sin(angle) * startRadius;

        const endX = centerX + Math.cos(angle) * endRadius - 16;
        const endY = centerY + Math.sin(angle) * endRadius - 16;

        document.body.appendChild(f);

        f.animate(
          [
            { transform: `translate(${startX}px, ${startY}px) scale(0.5) rotate(0deg)`, opacity: 0 },
            { transform: `translate(${endX}px, ${endY}px) scale(1.2) rotate(360deg)`, opacity: 1 }
          ],
          {
            duration: 1400,
            easing: "cubic-bezier(0.22, 1, 0.36, 1)",
            fill: "forwards"
          }
        );
      }
    }
</script>
</body>
</html>
